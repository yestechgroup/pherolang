[package]
name = "phero-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared parser substrate: byte spans, token-slice input, recovery combinators, grammar-doc helpers"
repository.workspace = true

# Cannot mix lints.workspace with overrides; mirror the workspace lints
# (clippy::all = warn) and allow unsafe: chumsky 0.10's `Input` trait
# declares required `unsafe fn`s that the generic token-slice input must
# implement (`src/input.rs`). This crate is the ONLY workspace member that
# permits unsafe; every surface crate keeps `unsafe_code = "forbid"`.
[lints]
clippy.all = "warn"

[lints.rust]
unsafe_code = "allow"

[dependencies]
chumsky = { workspace = true }
thiserror = { workspace = true }
