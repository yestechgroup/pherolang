[workspace]
resolver = "2"
members = [
    "crates/phero-syntax",
    "crates/phero-parser",
    "crates/phero-ir",
    "crates/phero-highlight",
    "crates/phero-expr",
    "crates/phero-ifml",
    "crates/phero-driver",
    "crates/phero-backend-rust",
    "crates/phero-backend-jsonschema",
    "crates/phero-backend-cedar",
    "crates/phero-backend-cmmn",
    "crates/phero-backend-dmn",
    "crates/phero-backend-ddd",
    "crates/phero-backend-common",
    "crates/phero-vocab",
    "crates/phero-lsp",
    "crates/phero-runtime",
    "crates/phero-cli",
    "crates/phero-verify",
    "crates/phero-diagnostics",
    "crates/phero-evidence",
    "crates/phero-strings",
    "crates/phero-dates",
    "crates/phero-testkit",
    # The Rune (`.rosetta`) toolchain, imported from yestechgroup/sigil
    # (ADR 0012). Model and resolver carry Phero names since RN11; the
    # staged sigil-* crates retire in RN10/RN15.
    "crates/sigil-diag",
    "crates/sigil-syntax",
    "crates/phero-rune-model",
    "crates/phero-rune-resolve",
    "crates/sigil-cli",
    "crates/sigil-lsp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Phero Lang: a verifiable, multi-target modeling language inspired by Eclipse Xcore"
repository = "https://github.com/yestechgroup/pherolang"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
phero-syntax = { path = "crates/phero-syntax" }
phero-parser = { path = "crates/phero-parser" }
phero-ir = { path = "crates/phero-ir" }
phero-highlight = { path = "crates/phero-highlight" }
phero-expr = { path = "crates/phero-expr" }
phero-ifml = { path = "crates/phero-ifml" }
phero-driver = { path = "crates/phero-driver" }
phero-backend-rust = { path = "crates/phero-backend-rust" }
phero-backend-jsonschema = { path = "crates/phero-backend-jsonschema" }
phero-backend-cedar = { path = "crates/phero-backend-cedar" }
phero-backend-ddd = { path = "crates/phero-backend-ddd" }
phero-backend-common = { path = "crates/phero-backend-common" }
phero-vocab = { path = "crates/phero-vocab" }
phero-lsp = { path = "crates/phero-lsp" }
phero-runtime = { path = "crates/phero-runtime" }
phero-verify = { path = "crates/phero-verify" }
phero-diagnostics = { path = "crates/phero-diagnostics" }
phero-evidence = { path = "crates/phero-evidence" }
phero-strings = { path = "crates/phero-strings" }
phero-dates = { path = "crates/phero-dates" }
# Dev-only shared test fixtures (issue pherolang#260): never a production dependency.
phero-testkit = { path = "crates/phero-testkit" }

# The Rune DSL (`.rosetta`) toolchain, in-tree since ADR 0012 (imported
# from yestechgroup/sigil at 0e1e4b1). The model and resolver are
# phero-rune-* since RN11; RN10/RN15 retire the staged sigil-* crates.
sigil-diag = { path = "crates/sigil-diag" }
sigil-syntax = { path = "crates/sigil-syntax" }
phero-rune-model = { path = "crates/phero-rune-model" }
phero-rune-resolve = { path = "crates/phero-rune-resolve" }

# The restingstate statechart toolchain, pinned by rev — `.ddd` state
# machines lower into its language-neutral Machine IR (xstate-ir is the
# compatibility boundary; the lowering contract lives in docs/DDD.md).
# The repository is public, so a clean checkout (and `cargo install --git`)
# fetches it without credentials. xstate-parser is the fail-closed
# TypeScript/XState parser the `.ddd` machine references compile through
# (issue pherolang#388); both crates pin the same rev so the tree carries
# exactly one checkout.
xstate-ir = { git = "https://github.com/yestechgroup/restingstate.git", rev = "da0c804d3c30a0bcc938562e39a4b7d7505c663b" }
xstate-parser = { git = "https://github.com/yestechgroup/restingstate.git", rev = "da0c804d3c30a0bcc938562e39a4b7d7505c663b" }

# The dsntk decision-table toolchain (yestechgroup fork of DecisionToolkit/dsntk),
# pinned by rev — the `.dmn` surface validates external markdown decision tables
# through dsntk-recognizer (`from_markdown`) and FEEL expression syntax through
# dsntk-feel-parser. The validation contract lives in `crates/phero-driver/src/dmn.rs`
# and `docs/DMN.md`; the recognizer's decision-table type is the
# compatibility boundary (phero-ir stays ours).
dsntk-recognizer = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-model = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-model-evaluator = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-common = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-feel = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-feel-parser = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }
dsntk-feel-evaluator = { git = "https://github.com/yestechgroup/dsntk-rs.git", rev = "b926458c089085fb59e9178d549f27a8119e45ff" }

anyhow = "1.0"
ariadne = "0.6"
chumsky = "0.13"
clap = { version = "4.5", features = ["derive"] }
jsonschema = "0.61"
creusot-std = "0.14.0"
logos = "0.15"
proptest = "1.11"
# Benchmarks of the imported Rune toolchain (sigil-cli, sigil-lsp); never in the gate.
criterion = "0.5"
salsa = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
slotmap = "1.0"
thiserror = "2.0"
tower-lsp-server = "0.23"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
ureq = "3.4"
walkdir = "2.5"
clap_complete = "4.6"
clap_mangen = "0.3"
