name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The rev-pinned git dependencies (xstate-ir, dsntk) fetch through
  # the git CLI: it resolves bare `rev = "<sha>"` pins more reliably than
  # cargo's default libgit2 backend. The three repositories are public, so
  # no credentials are involved.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The dsntk dependency tree pushed the full --all-targets build past the
  # runner's disk budget (the linker Bus-errors when the disk fills); CI
  # builds without incremental compilation and without debuginfo, which
  # keeps target/ tens of GB smaller without changing any test's semantics.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  # Advisory + license/supply-chain gates (WI-5 of v0.2, issue #173), plus the
  # #208 anti-vacuity mutant harness. Kept as separate fast jobs: a red audit
  # must not block unrelated test signal, and a surviving mutant must be red
  # without blocking the seven-step gate. Only the mutants job builds (the
  # rows' test binaries), so it carries its own cache key — never the `test`
  # job's cache.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    runs-on: ubuntu-latest
    env:
      # The rev-pinned git deps (xstate-ir, dsntk) fetch through the
      # git CLI — cargo-deny reads their sources for the license check.
      # They are public repositories, so no credentials are involved.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Issue #208: a `tested` row is only worth what its own tests can falsify.
  # The harness applies the row's recorded mutant patch, runs only that row's
  # pinned tests, and reverts; a survivor means the tests are green but
  # vacuous, which must be red here. Its own job for the same reason as
  # audit/deny (a red mutant must not block the gate's signal), and its own
  # cache key because it builds test binaries.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verbatim from the test job: the mutant run builds phero-driver and
      # phero-ifml test binaries, and the runner's preinstalled toolchains we
      # don't use are tens of GB (the SIGBUS-when-the-disk-fills failure).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/julia /usr/local/lib/R /usr/local/share/chromium /opt/microsoft || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h / /tmp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - run: scripts/ci-local.sh mutants

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The full workspace build + scratch-crate e2e + doctest linking
      # exceed the runner's default free disk, and lld dies with SIGBUS
      # writing mmap'd output when it fills (`ld terminated with signal 7`
      # in the Doc-tests section). The preinstalled toolchains we don't use
      # are tens of GB. The dsntk dependency tree (chrono-tz, the icu data
      # crates, dfp-number-sys) grew the dep tree enough that the default
      # dev profile no longer fits either: CI builds with incremental
      # compilation and debuginfo disabled (job env below), which keeps
      # target/ tens of GB smaller without changing any test's semantics.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/julia /usr/local/lib/R /usr/local/share/chromium /opt/microsoft || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h / /tmp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: scripts/ci-local.sh build
      # Each gate step below exits non-zero when it prints a *-FAIL marker,
      # so a red marker is a red step. `if: !cancelled()` keeps every later
      # gate running after an earlier one fails, so one run still reports
      # every gate (the old always-green steps ran them all too).
      # The platform guard (ADR 0004, issue #284) and the rebrand guard
      # (epic #270, P0-03): revived non-Linux platform tokens and revived
      # pre-0.3 spellings are documentation/identifier regressions no build
      # or test can see. Cheap, so both run before the expensive test step.
      # The contracts are docs/adr/0004 and docs/NAMING.md; the allowlists
      # live in scripts/check-platforms.sh and scripts/check-rebrand.sh.
      - name: Platform and rebrand guards
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh rebrand
      # The documentation quality gate (docs/documentation/EDITORIAL_POLICY.md):
      # the content model, heading sets, terminology, and every compilable
      # Guide example. Runs before the expensive test step so a documentation
      # regression fails fast; it only needs the binary from the build step.
      - name: Documentation quality
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh docs-lint
      # Every gate below invokes scripts/ci-local.sh — the single source
      # of truth for the gate sequence and the fixture-glob list (issue
      # #121): local and remote can never drift. Step boundaries match the
      # script's subcommands 1:1 so the Actions view stays legible.
      # rustdoc links doctest artifacts under TMPDIR, which defaults to
      # the small tmpfs /tmp — the linker SIGBUSes there (the AGENTS.md
      # testing-quirks gotcha; `ld terminated with signal 7`). The script
      # points TMPDIR at the disk-backed target/ and caps the job count so
      # the eleven phero-driver doctests don't link concurrently.
      - name: Tests
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh test
      - name: Clippy
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh clippy
      - name: Format check
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh fmt
      # The verification receipt is a golden (issue #207): regenerate it from
      # the sources it names and byte-compare with the committed file, so a
      # source, artifact, or register change without regeneration is red.
      - name: Receipt freshness
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh receipt
      # Broken intra-doc links are warnings by default; -D warnings makes
      # them errors so the gate stays visible (issue #175). cargo doc runs
      # no doctests, so it needs no TMPDIR dance.
      - name: Docs
        if: ${{ !cancelled() }}
        run: scripts/ci-local.sh docs
