name: Release

# Tag-driven release (epic #270, R3). Cutting a release is a tag, not a
# branch: the operator runbook is docs/RELEASE-0.4.0.md.
#
# `workflow_dispatch` exists for re-running a release after a fix. It must be
# dispatched ON THE TAG REF (`gh workflow run release.yml --ref v0.3.0`),
# because GITHUB_REF_NAME is what names the archives, the checksum manifest,
# and the published release. A dispatch from a branch fails the "Resolve
# version" step by construction. Note that a dispatch reads the workflow file
# *at that ref*, so a fix to this file only reaches a tag that is re-created
# after the fix lands on main.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# The only permission this workflow needs: creating/updating the GitHub
# Release and uploading its assets. Everything else is the default-deny.
permissions:
  contents: write

env:
  # Same profile reasoning as ci.yml: the release build is one-shot, and
  # incremental state plus debuginfo would bloat the runner's disk without
  # changing the shipped binary's behavior.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      # One broken leg must not cancel the others: a partial matrix tells the
      # operator which platform regressed. `release` waits for every leg and
      # never publishes from a half-built matrix.
      fail-fast: false
      matrix:
        # Asset-naming contract, shared with `.github/workflows/site.yml`:
        #   pherolang-<version>-<target>.tar.gz
        #   SHA256SUMS                           (one line per archive)
        # site.yml's PHEROLANG_ASSET_PATTERN must match
        # `pherolang-*-x86_64-unknown-linux-gnu.tar.gz`; if the naming here
        # changes, that pattern changes in the same commit or the site's
        # binary download silently 404s.
        #
        # Linux only — x86_64 and aarch64, both on the same runner — is the
        # supported set (docs/adr/0004-supported-platforms-linux-only.md).
        # A row here is a support claim, not a build experiment: the archive
        # is built, published, and documented. Adding a platform is a
        # maintainer decision that comes with a CI job which *executes* the
        # binary; a leg nobody runs is a claim we cannot back.
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from the tag, never from the workspace manifest:
      # `--locked` already pins the build to the committed Cargo.lock, so the
      # tag and the manifest version must agree before the first step runs.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref '$GITHUB_REF_NAME' is not a vX.Y.Z tag; dispatch on the tag ref"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The cross leg needs the target's C toolchain *and* its libc headers:
      # the compiler alone links, but `ring`'s build script includes
      # <bits/libc-header-start.h> from the target sysroot and fails without
      # libc6-dev-<arch>-cross.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        env:
          # Consumed only by the aarch64-unknown-linux-gnu target; an empty
          # value on the other legs is inert.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --locked -p phero-cli --target '${{ matrix.target }}'

      # Packaging below names the binary by path. Assert it exists here so a
      # future Cargo layout change fails this job instead of shipping an
      # empty or half-built archive.
      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/pherolang"
          test -f "$bin" || { echo "::error::expected binary missing: $bin"; exit 1; }
          ls -l "$bin"

      # The released binary is the contract the site consumes. Prove the two
      # commands SH4/SH5 rely on are present and usable *in the archive this
      # release will publish*, not merely in a debug build of the same commit:
      # `highlight` must emit the v1 JSON artifact, and the generated grammar
      # package must round-trip through `--out`/`--check`.
      - name: Verify the highlight contract
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/pherolang"
          # A cross-built aarch64 binary cannot execute on the x86_64 runner.
          # Run it through qemu-user with the target sysroot installed above,
          # so the published archive is still proven, not merely inspected.
          # Ubuntu 26 ships `qemu-aarch64` from the `qemu-user` package; older
          # images used the statically named binary. Accept either.
          run=()
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then
            qemu="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
            if [ -z "$qemu" ]; then
              echo '::error::qemu-aarch64 not found; install qemu-user'
              exit 1
            fi
            run=("$qemu" -L /usr/aarch64-linux-gnu)
          fi
          json="$(printf 'class A { }\n' | "${run[@]}" "$bin" highlight --surface mox --format json -)"
          printf '%s\n' "$json" | grep -q '"formatVersion": 1'
          printf '%s\n' "$json" | grep -q '"surface": "mox"'
          grammars="$(mktemp -d)"
          "${run[@]}" "$bin" grammar --out "$grammars" >/dev/null
          "${run[@]}" "$bin" grammar --check "$grammars" >/dev/null
          echo "highlight + grammar contract verified in $bin"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          target='${{ matrix.target }}'
          asset="pherolang-${version}-${target}.tar.gz"
          mkdir -p dist
          # The binary sits at the archive root, so `tar -xzf` followed by
          # `./pherolang` works without a cd into a target-named directory.
          tar -czf "dist/${asset}" -C "target/${target}/release" 'pherolang'
          # "<hex>  <name>" is the only format `sha256sum -c` reads.
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          cat "dist/${asset}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pherolang-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Completeness is already structural: a failed or cancelled leg
          # leaves this job unrun (`needs: build`), so nothing below has to
          # count archives. What is checked here is integrity — every archive
          # carries a checksum, and the checksum matches the bytes.
          archives=$(ls pherolang-*.tar.gz)
          for archive in $archives; do
            if [ ! -f "$archive.sha256" ]; then
              echo "::error::$archive has no checksum"
              exit 1
            fi
          done
          # One `sha256sum -c`-compatible line per archive, sorted by file
          # name so the manifest is byte-stable across re-runs.
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          # Verify the concatenation against the files before publishing it:
          # a truncated download artifact is caught here, not by a user.
          sha256sum -c SHA256SUMS
          echo "targets published by this run:"
          ls -l ./*.tar.gz

      # Notes are generated from the merged PRs rather than pasted from
      # CHANGELOG.md. The changelog stays the source of truth for drift, and
      # the generator links every PR it credits — hand-pasting is how a
      # release note and the changelog start disagreeing.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Phero Lang ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pherolang-*.tar.gz
            dist/SHA256SUMS
