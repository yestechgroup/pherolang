# Reference pages may use artifact facts in `## Compatibility`; integration
# pages may document wire contracts in full. Matched as whole words,
# case-sensitive for identifiers.
implementation_vocabulary:
  words:
    - salsa
    - chumsky
    - logos
    - serde
    - ariadne
    - lowering
    - lowered
    - emitter
    - AST
    - IR
    - wire format
    - span table
    - artifact
